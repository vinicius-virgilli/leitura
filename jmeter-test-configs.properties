# Configurações de Teste JMeter - API de Leitura
# Este arquivo contém configurações para diferentes ambientes e cenários de teste

# ============================================================================
# CONFIGURAÇÕES GERAIS
# ============================================================================

# Configurações de conexão padrão
default.host=localhost
default.port=8080
default.protocol=http
default.timeout.connect=10000
default.timeout.response=30000

# Credenciais de teste
test.admin.email=admin@teste.com
test.admin.password=123456
test.user.email=user@teste.com
test.user.password=123456

# ============================================================================
# AMBIENTE LOCAL - DESENVOLVIMENTO
# ============================================================================

local.host=localhost
local.port=8080
local.protocol=http

# Configurações de carga reduzida para desenvolvimento
local.threads.login=10
local.threads.read=25
local.threads.write=5
local.threads.stress=50
local.threads.health=2

local.duration.login=60
local.duration.read=120
local.duration.write=60
local.duration.stress=180
local.duration.health=300

local.rampup.login=10
local.rampup.read=20
local.rampup.write=10
local.rampup.stress=30
local.rampup.health=5

# ============================================================================
# AMBIENTE DE TESTE - QA
# ============================================================================

qa.host=qa-api.leitura.com
qa.port=80
qa.protocol=https

# Configurações de carga média para QA
qa.threads.login=25
qa.threads.read=75
qa.threads.write=15
qa.threads.stress=100
qa.threads.health=3

qa.duration.login=180
qa.duration.read=300
qa.duration.write=180
qa.duration.stress=600
qa.duration.health=900

qa.rampup.login=20
qa.rampup.read=45
qa.rampup.write=15
qa.rampup.stress=60
qa.rampup.health=10

# ============================================================================
# AMBIENTE DE HOMOLOGAÇÃO - STAGING
# ============================================================================

staging.host=staging-api.leitura.com
staging.port=443
staging.protocol=https

# Configurações de carga alta para homologação
staging.threads.login=50
staging.threads.read=150
staging.threads.write=30
staging.threads.stress=200
staging.threads.health=5

staging.duration.login=300
staging.duration.read=600
staging.duration.write=300
staging.duration.stress=900
staging.duration.health=1200

staging.rampup.login=30
staging.rampup.read=90
staging.rampup.write=30
staging.rampup.stress=120
staging.rampup.health=15

# ============================================================================
# AMBIENTE DE PRODUÇÃO - PERFORMANCE TEST
# ============================================================================

prod.host=api.leitura.com
prod.port=443
prod.protocol=https

# Configurações de carga máxima para testes de produção
prod.threads.login=100
prod.threads.read=500
prod.threads.write=50
prod.threads.stress=1000
prod.threads.health=10

prod.duration.login=600
prod.duration.read=1800
prod.duration.write=600
prod.duration.stress=3600
prod.duration.health=3600

prod.rampup.login=60
prod.rampup.read=300
prod.rampup.write=60
prod.rampup.stress=600
prod.rampup.health=30

# ============================================================================
# CONFIGURAÇÕES DE RATE LIMITING
# ============================================================================

# Limites esperados (para validação)
rate.limit.login.max=10
rate.limit.login.window=1
rate.limit.create.max=5
rate.limit.create.window=1
rate.limit.read.max=100
rate.limit.read.window=1

# ============================================================================
# CONFIGURAÇÕES DE PERFORMANCE TARGETS
# ============================================================================

# Tempos de resposta esperados (em ms)
performance.target.login.avg=200
performance.target.login.p95=500
performance.target.read.avg=100
performance.target.read.p95=300
performance.target.write.avg=300
performance.target.write.p95=800
performance.target.health.avg=50
performance.target.health.p95=150

# Throughput esperado (req/s)
performance.target.login.throughput=50
performance.target.read.throughput=500
performance.target.write.throughput=100
performance.target.health.throughput=10

# Taxa de erro aceitável (%)
performance.target.error.rate=1.0

# ============================================================================
# CONFIGURAÇÕES DE CACHE
# ============================================================================

# Configurações para teste de cache
cache.warmup.requests=100
cache.test.iterations=1000
cache.expected.hit.ratio=80
cache.expected.response.time.hit=50
cache.expected.response.time.miss=200

# ============================================================================
# CONFIGURAÇÕES DE MONITORAMENTO
# ============================================================================

# Intervalos de coleta de métricas (em segundos)
monitoring.health.check.interval=30
monitoring.metrics.collection.interval=60
monitoring.prometheus.scrape.interval=15

# Thresholds para alertas
monitoring.cpu.threshold=80
monitoring.memory.threshold=85
monitoring.disk.threshold=90
monitoring.response.time.threshold=1000
monitoring.error.rate.threshold=5

# ============================================================================
# CONFIGURAÇÕES DE RELATÓRIOS
# ============================================================================

# Configurações de geração de relatórios
report.generate.html=true
report.generate.csv=true
report.generate.json=false
report.include.response.data=false
report.include.request.headers=false
report.include.response.headers=false

# Configurações de agregação
report.aggregate.percentiles=50,90,95,99
report.aggregate.granularity=60
report.aggregate.errors.only=false

# ============================================================================
# CONFIGURAÇÕES DE DADOS DE TESTE
# ============================================================================

# Configurações para geração de dados
test.data.users.count=1000
test.data.books.count=5000
test.data.metrics.count=10000

# Padrões de dados
test.data.user.name.pattern=Usuario_Teste_{}
test.data.user.email.pattern=teste{}@exemplo.com
test.data.book.title.pattern=Livro_Teste_{}
test.data.book.author.pattern=Autor_Teste_{}

# ============================================================================
# CONFIGURAÇÕES DE SEGURANÇA
# ============================================================================

# Configurações SSL/TLS
security.ssl.verify=true
security.ssl.protocol=TLSv1.2
security.ssl.keystore.path=
security.ssl.keystore.password=
security.ssl.truststore.path=
security.ssl.truststore.password=

# Configurações de autenticação
security.auth.token.expiry=3600
security.auth.refresh.enabled=true
security.auth.refresh.threshold=300

# ============================================================================
# CONFIGURAÇÕES AVANÇADAS
# ============================================================================

# Configurações de JMeter
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.label=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.filename=false
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.idle_time=true

# Configurações de heap para JMeter
jmeter.heap.initial=1g
jmeter.heap.maximum=4g
jmeter.gc.algorithm=G1GC

# Configurações de rede
network.connection.pool.size=20
network.connection.timeout=10000
network.socket.timeout=30000
network.keep.alive=true
network.tcp.nodelay=true

# ============================================================================
# INSTRUÇÕES DE USO
# ============================================================================

# Para usar essas configurações:
# 
# 1. Via linha de comando:
#    jmeter -n -t test.jmx -q jmeter-test-configs.properties -Jenvironment=local
# 
# 2. Via script:
#    ./run_load_tests.sh -h $(grep local.host jmeter-test-configs.properties | cut -d'=' -f2)
# 
# 3. Sobrescrever configurações específicas:
#    jmeter -n -t test.jmx -Jlocal.threads.stress=100 -Jlocal.duration.stress=300
# 
# 4. Usar perfil específico:
#    jmeter -n -t test.jmx -Jenvironment=qa -Jqa.host=meu-servidor-qa.com