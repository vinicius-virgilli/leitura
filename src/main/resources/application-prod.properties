# =============================================================================
# LEITURA API - CONFIGURAÇÕES DE PRODUÇÃO
# =============================================================================
# Este arquivo contém configurações específicas para o ambiente de produção.
# Ativado com: java -Dquarkus.profile=prod -jar app.jar
# IMPORTANTE: Sempre utilize variáveis de ambiente para dados sensíveis!

quarkus.profile=prod

# =============================================================================
# CONFIGURAÇÕES DE BANCO DE DADOS - PRODUÇÃO
# =============================================================================
# PostgreSQL para produção (OBRIGATÓRIO usar variáveis de ambiente)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Pool de conexões otimizado para produção
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.leak-detection-interval=60S
quarkus.datasource.jdbc.idle-timeout=300S
quarkus.datasource.jdbc.max-lifetime=1800S

# Configurações do Hibernate para produção
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.show-sql=false
quarkus.hibernate-orm.format-sql=false

# Configurações de performance do Hibernate
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.fetch.batch-size=32
quarkus.hibernate-orm.cache.l2.enabled=true
quarkus.hibernate-orm.second-level-cache-enabled=true
quarkus.hibernate-orm.query-cache-enabled=true

# =============================================================================
# CONFIGURAÇÕES DE LOGGING - PRODUÇÃO
# =============================================================================
# Logs otimizados para produção
quarkus.log.level=INFO
quarkus.log.category."com.leitura".level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."ROOT".level=WARN

# Formato de log estruturado para produção
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.color=false

# Configurações de arquivo de log (se necessário)
quarkus.log.file.enable=true
quarkus.log.file.path=/var/log/leitura/application.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true

# =============================================================================
# CONFIGURAÇÕES DE TIMEZONE - PRODUÇÃO
# =============================================================================
quarkus.jvm.args=-Duser.timezone=America/Sao_Paulo

# =============================================================================
# CONFIGURAÇÕES DE AGENDAMENTO - PRODUÇÃO
# =============================================================================
# Tarefa agendada para produção
scheduler.progresso.identity=atualiza-progresso-leitura-prod

# Execução diária às 8h UTC (5h da manhã em Brasília)
scheduler.progresso.cron=0 0 8 * * ?

# =============================================================================
# CONFIGURAÇÕES DE SEGURANÇA - PRODUÇÃO
# =============================================================================
# CORS restritivo para produção (configurar domínios específicos)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://leitura.app.com}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=3600

# Headers de segurança obrigatórios para produção
# quarkus.http.header."X-Content-Type-Options".value=nosniff
# quarkus.http.header."X-Frame-Options".value=DENY
# quarkus.http.header."X-XSS-Protection".value=1; mode=block
# quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
# quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'
# quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
# quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=()

# =============================================================================
# CONFIGURAÇÕES DE PERFORMANCE - PRODUÇÃO
# =============================================================================
# HTTP otimizado para produção
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/plain,text/css,text/javascript,application/javascript,application/json
quarkus.http.compression-level=6

# Timeouts otimizados para produção
quarkus.http.read-timeout=30S
quarkus.http.idle-timeout=60S
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=5M
quarkus.http.limits.max-form-attribute-size=2048

# Cache HTTP
quarkus.http.static-resources.cache-control=max-age=86400

# =============================================================================
# CONFIGURAÇÕES DE MONITORAMENTO - PRODUÇÃO
# =============================================================================
# Health checks obrigatórios para produção
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready
quarkus.smallrye-health.startup-path=/health/started

# Métricas habilitadas para monitoramento
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server=true

# =============================================================================
# CONFIGURAÇÕES DE SWAGGER/OPENAPI - PRODUÇÃO
# =============================================================================
# Swagger habilitado em produção para documentação da API
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.title=Leitura API - Documentação (Produção)
quarkus.swagger-ui.theme=flattop

# OpenAPI disponível apenas para documentação interna
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Leitura API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de leituras - Produção
quarkus.smallrye-openapi.servers=${API_BASE_URL:https://api.leitura.com}

# =============================================================================
# CONFIGURAÇÕES DE CACHE - PRODUÇÃO
# =============================================================================
# Cache habilitado para performance
quarkus.cache.enabled=true
quarkus.cache.caffeine."default".initial-capacity=100
quarkus.cache.caffeine."default".maximum-size=1000
quarkus.cache.caffeine."default".expire-after-write=PT30M

# =============================================================================
# CONFIGURAÇÕES DE TRANSAÇÃO - PRODUÇÃO
# =============================================================================
# Timeout de transação otimizado
quarkus.transaction-manager.default-transaction-timeout=300

# =============================================================================
# CONFIGURAÇÕES DE JVM - PRODUÇÃO
# =============================================================================
# Configurações de memória e GC (ajustar conforme recursos disponíveis)
quarkus.jvm.args=-Xms512m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication

# =============================================================================
# CONFIGURAÇÕES DE LOCALIZAÇÃO - PRODUÇÃO
# =============================================================================
quarkus.locales=pt-BR,en-US
quarkus.default-locale=pt-BR

# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO - PRODUÇÃO
# =============================================================================
# Recursos de desenvolvimento desabilitados
quarkus.live-reload.instrumentation=false
quarkus.dev-ui.enabled=false

# =============================================================================
# CONFIGURAÇÕES DE BACKUP E MANUTENÇÃO
# =============================================================================
# Configurações para backup automático (se implementado)
# backup.enabled=${BACKUP_ENABLED:true}
# backup.schedule=${BACKUP_SCHEDULE:0 0 2 * * ?}
# backup.retention.days=${BACKUP_RETENTION_DAYS:30}

# =============================================================================
# VARIÁVEIS DE AMBIENTE OBRIGATÓRIAS
# =============================================================================
# As seguintes variáveis DEVEM ser definidas no ambiente de produção:
# - DB_USER: Usuário do banco de dados
# - DB_PASSWORD: Senha do banco de dados
# - DB_URL: URL de conexão com o banco
# - CORS_ORIGINS: Domínios permitidos para CORS
# - API_BASE_URL: URL base da API para documentação
# - BACKUP_ENABLED: Habilitar backup automático (opcional)
# - BACKUP_SCHEDULE: Agendamento do backup (opcional)
# - BACKUP_RETENTION_DAYS: Dias de retenção do backup (opcional)