# =============================================================================
# LEITURA API - CONFIGURAÇÕES DE TESTE
# =============================================================================
# Este arquivo contém configurações específicas para execução de testes.
# Ativado automaticamente durante a execução de testes (mvn test)

# =============================================================================
# CONFIGURAÇÕES DE BANCO DE DADOS - TESTE
# =============================================================================
# H2 em memória para testes rápidos e isolados
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Configurações específicas para testes
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.show-sql=false
quarkus.hibernate-orm.format-sql=true

# Pool de conexões mínimo para testes
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.jdbc.acquisition-timeout=5

# Configurações de performance para testes
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.fetch.batch-size=32
quarkus.hibernate-orm.cache.l2.enabled=false

# =============================================================================
# CONFIGURAÇÕES DE LOGGING - TESTE
# =============================================================================
# Logs controlados para não poluir a saída dos testes
quarkus.log.level=WARN
quarkus.log.category."com.leitura".level=INFO
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=WARN
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."ROOT".level=WARN

# Formato de log simplificado para testes
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] %s%e%n
quarkus.log.console.color=false

# =============================================================================
# CONFIGURAÇÕES DE TIMEZONE - TESTE
# =============================================================================
# Timezone fixo para testes consistentes
quarkus.jvm.args=-Duser.timezone=America/Sao_Paulo

# =============================================================================
# CONFIGURAÇÕES DE AGENDAMENTO - TESTE
# =============================================================================
# Desabilitar agendamento automático em testes
scheduler.progresso.identity=atualiza-progresso-leitura-test

# Agendamento desabilitado para testes (cron que nunca executa)
scheduler.progresso.cron=0 0 0 31 2 ? 2099

# =============================================================================
# CONFIGURAÇÕES DE HTTP - TESTE
# =============================================================================
# Porta aleatória para evitar conflitos em testes paralelos
quarkus.http.test-port=0

# Timeouts reduzidos para testes mais rápidos
quarkus.http.read-timeout=10S
quarkus.http.body.handle-file-uploads=false
quarkus.http.limits.max-body-size=1M

# Compressão desabilitada para testes
quarkus.http.enable-compression=false

# =============================================================================
# CONFIGURAÇÕES DE CORS - TESTE
# =============================================================================
# CORS desabilitado para testes
quarkus.http.cors=false

# =============================================================================
# CONFIGURAÇÕES DE SWAGGER/OPENAPI - TESTE
# =============================================================================
# Swagger desabilitado em testes para performance
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.enable=false
quarkus.smallrye-openapi.auto-add-servers=false

# =============================================================================
# CONFIGURAÇÕES DE PERFORMANCE - TESTE
# =============================================================================
# Health checks simplificados para testes
quarkus.smallrye-health.root-path=/health

# Métricas desabilitadas para testes mais rápidos
quarkus.micrometer.enabled=false
quarkus.micrometer.export.prometheus.enabled=false

# =============================================================================
# CONFIGURAÇÕES DE SEGURANÇA - TESTE
# =============================================================================
# Headers de segurança desabilitados para testes
# quarkus.http.header."X-Content-Type-Options".value=nosniff
# quarkus.http.header."X-Frame-Options".value=SAMEORIGIN
# quarkus.http.header."X-XSS-Protection".value=1; mode=block

# =============================================================================
# CONFIGURAÇÕES DE TRANSAÇÃO - TESTE
# =============================================================================
# Configurações de transação otimizadas para testes
quarkus.transaction-manager.default-transaction-timeout=30

# =============================================================================
# CONFIGURAÇÕES DE CACHE - TESTE
# =============================================================================
# Cache desabilitado para testes isolados
quarkus.cache.enabled=false

# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO - TESTE
# =============================================================================
# Hot reload desabilitado em testes
quarkus.live-reload.instrumentation=false

# Dev UI desabilitado em testes
quarkus.dev-ui.enabled=false

# =============================================================================
# CONFIGURAÇÕES DE LOCALIZAÇÃO - TESTE
# =============================================================================
# Localização fixa para testes consistentes
quarkus.locales=pt-BR
quarkus.default-locale=pt-BR
