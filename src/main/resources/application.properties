quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.datasource.jdbc.max-size=8


# Nome da tarefa agendada
scheduler.progresso.identity=atualiza-progresso-leitura

# Agendamento para 8h UTC (5h da manh� em Bras�lia)
scheduler.progresso.cron=0 0 8 * * ?

quarkus.jvm.args=-Duser.timezone=America/Sao_Paulo

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.info-title=Leitura API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para gerenciamento de leituras
quarkus.smallrye-openapi.info-contact-email=Vinicius.Virgilli3@gmail.com
quarkus.smallrye-openapi.info-contact-name=Vinicius Virgilli
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
