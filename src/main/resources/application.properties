quarkus.profile=dev

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.hibernate-orm.database.generation=update

# Log de queries SQL (desabilitado em produção por performance)
quarkus.hibernate-orm.log.sql=false

# Configurações de performance do Hibernate
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.fetch.batch-size=16

# =============================================================================
# CONFIGURAÇÕES DE AGENDAMENTO DE TAREFAS
# =============================================================================
# Identificador único da tarefa de atualização de progresso
scheduler.progresso.identity=atualiza-progresso-leitura

# Agendamento: todos os dias às 8h UTC (5h da manhã em Brasília)
# Formato: segundo minuto hora dia mês dia-da-semana
scheduler.progresso.cron=0 0 8 * * ?

# =============================================================================
# CONFIGURAÇÕES DE TIMEZONE E LOCALIZAÇÃO
# =============================================================================
# Define o timezone padrão da aplicação
quarkus.jvm.args=-Duser.timezone=America/Sao_Paulo

# Configurações de localização
quarkus.locales=pt-BR,en-US
quarkus.default-locale=pt-BR

# =============================================================================
# CONFIGURAÇÕES DE LOGGING
# =============================================================================
# Nível de log padrão
quarkus.log.level=INFO

# Configurações específicas por categoria
quarkus.log.category."org.viniciusvirgilli".level=DEBUG
quarkus.log.category."com.leitura".level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=INFO

# Formato do log
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# =============================================================================
# CONFIGURAÇÕES DE SEGURANÇA
# =============================================================================
# CORS - configurações para desenvolvimento (ajustar para produção)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Headers de segurança
# quarkus.http.header."X-Content-Type-Options".value=nosniff
# quarkus.http.header."X-Frame-Options".value=DENY
# quarkus.http.header."X-XSS-Protection".value=1; mode=block

# Configurações para geração e validação de tokens JWT
# Chave secreta para assinatura dos tokens (em produção, usar variável de ambiente)
mp.jwt.verify.issuer=leitura-api
smallrye.jwt.verify.key.location=META-INF/resources/publickey.jwk
smallrye.jwt.verify.algorithm=RS256
# smallrye.jwt.sign.key.location=META-INF/resources/private_key.pem
mp.jwt.verify.publickey.algorithm=RS256

# =============================================================================
# CONFIGURAÇÕES DE PERFORMANCE E MONITORAMENTO
# =============================================================================
# Health checks
quarkus.smallrye-health.root-path=/health

# Métricas (configurações removidas - extensões não disponíveis)

# =============================================================================
# CONFIGURAÇÕES DO OPENAPI/SWAGGER
# =============================================================================
# Informações básicas da API
quarkus.smallrye-openapi.info-title=Leitura API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de leituras e acompanhamento de progresso

# Informações de contato
quarkus.smallrye-openapi.info-contact-email=Vinicius.Virgilli3@gmail.com
quarkus.smallrye-openapi.info-contact-name=Vinicius Virgilli
quarkus.smallrye-openapi.info-contact-url=https://github.com/viniciusvirgilli

# Licença
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://opensource.org/licenses/MIT

# Caminhos da documentação
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Leitura API - Documentação

# Configurações adicionais do Swagger UI
quarkus.swagger-ui.theme=flattop
quarkus.swagger-ui.footer=Leitura API v1.0.0

# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================================================
# Hot reload em desenvolvimento
quarkus.live-reload.instrumentation=true

# =============================================================================
# CONFIGURAÇÕES DE PRODUÇÃO
# =============================================================================
# Configurações que serão sobrescritas em produção
# (ver application-prod.properties)

# Compressão HTTP
quarkus.http.enable-compression=true

# Timeout de requisições
quarkus.http.read-timeout=30S
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=10M
