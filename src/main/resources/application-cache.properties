# =============================================================================
# CONFIGURAÇÕES DE CACHE - OTIMIZAÇÃO DE PERFORMANCE
# =============================================================================

# Cache habilitado
quarkus.cache.enabled=true

# Configurações específicas para cada cache

# Cache de usuários - dados que mudam pouco
quarkus.cache.caffeine."usuarios".initial-capacity=50
quarkus.cache.caffeine."usuarios".maximum-size=500
quarkus.cache.caffeine."usuarios".expire-after-write=PT15M

quarkus.cache.caffeine."usuarios-ativos".initial-capacity=50
quarkus.cache.caffeine."usuarios-ativos".maximum-size=500
quarkus.cache.caffeine."usuarios-ativos".expire-after-write=PT10M

quarkus.cache.caffeine."usuario-por-id".initial-capacity=100
quarkus.cache.caffeine."usuario-por-id".maximum-size=1000
quarkus.cache.caffeine."usuario-por-id".expire-after-write=PT30M

quarkus.cache.caffeine."usuario-por-email".initial-capacity=100
quarkus.cache.caffeine."usuario-por-email".maximum-size=1000
quarkus.cache.caffeine."usuario-por-email".expire-after-write=PT30M

# Cache de livros - dados que podem mudar com frequência
quarkus.cache.caffeine."livros".initial-capacity=100
quarkus.cache.caffeine."livros".maximum-size=2000
quarkus.cache.caffeine."livros".expire-after-write=PT5M

quarkus.cache.caffeine."livros-por-usuario".initial-capacity=200
quarkus.cache.caffeine."livros-por-usuario".maximum-size=2000
quarkus.cache.caffeine."livros-por-usuario".expire-after-write=PT5M

quarkus.cache.caffeine."livro-por-id".initial-capacity=200
quarkus.cache.caffeine."livro-por-id".maximum-size=3000
quarkus.cache.caffeine."livro-por-id".expire-after-write=PT10M

quarkus.cache.caffeine."livro-por-id-usuario".initial-capacity=200
quarkus.cache.caffeine."livro-por-id-usuario".maximum-size=3000
quarkus.cache.caffeine."livro-por-id-usuario".expire-after-write=PT10M

quarkus.cache.caffeine."livros-por-status".initial-capacity=50
quarkus.cache.caffeine."livros-por-status".maximum-size=500
quarkus.cache.caffeine."livros-por-status".expire-after-write=PT3M

quarkus.cache.caffeine."livros-por-status-usuario".initial-capacity=100
quarkus.cache.caffeine."livros-por-status-usuario".maximum-size=1000
quarkus.cache.caffeine."livros-por-status-usuario".expire-after-write=PT3M

quarkus.cache.caffeine."livros-por-categoria".initial-capacity=50
quarkus.cache.caffeine."livros-por-categoria".maximum-size=500
quarkus.cache.caffeine."livros-por-categoria".expire-after-write=PT5M

quarkus.cache.caffeine."livros-por-categoria-usuario".initial-capacity=100
quarkus.cache.caffeine."livros-por-categoria-usuario".maximum-size=1000
quarkus.cache.caffeine."livros-por-categoria-usuario".expire-after-write=PT5M

# Cache de métricas - dados que mudam ocasionalmente
quarkus.cache.caffeine."metricas".initial-capacity=50
quarkus.cache.caffeine."metricas".maximum-size=1000
quarkus.cache.caffeine."metricas".expire-after-write=PT10M

quarkus.cache.caffeine."metricas-por-usuario".initial-capacity=100
quarkus.cache.caffeine."metricas-por-usuario".maximum-size=1000
quarkus.cache.caffeine."metricas-por-usuario".expire-after-write=PT10M

quarkus.cache.caffeine."metrica-por-categoria".initial-capacity=20
quarkus.cache.caffeine."metrica-por-categoria".maximum-size=200
quarkus.cache.caffeine."metrica-por-categoria".expire-after-write=PT15M

quarkus.cache.caffeine."metrica-por-categoria-usuario".initial-capacity=50
quarkus.cache.caffeine."metrica-por-categoria-usuario".maximum-size=500
quarkus.cache.caffeine."metrica-por-categoria-usuario".expire-after-write=PT15M

# Configurações globais de cache
quarkus.cache.caffeine.metrics-enabled=true