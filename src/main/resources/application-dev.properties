# =============================================================================
# LEITURA API - CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================================================
# Este arquivo contém configurações específicas para o ambiente de desenvolvimento.
# Ativado com: mvn quarkus:dev ou java -Dquarkus.profile=dev -jar app.jar

quarkus.profile=dev

# Configurações para geração e validação de tokens JWT
# Chave secreta para assinatura dos tokens (em produção, usar variável de ambiente)
smallrye.jwt.sign.key.location=META-INF/resources/private_key.pem

# =============================================================================
# CONFIGURAÇÕES DE BANCO DE DADOS - DESENVOLVIMENTO
# =============================================================================
# PostgreSQL local para desenvolvimento
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leitura

# Configurações específicas para desenvolvimento
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.show-sql=true

# Pool de conexões reduzido para desenvolvimento
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=5

# =============================================================================
# CONFIGURAÇÕES DE LOGGING - DESENVOLVIMENTO
# =============================================================================
# Logs mais verbosos para desenvolvimento
quarkus.log.level=DEBUG
quarkus.log.category."com.leitura".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE
quarkus.log.category."io.quarkus.hibernate.orm".level=DEBUG

# Formato de log mais detalhado para desenvolvimento
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.color=true

# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO E HOT RELOAD
# =============================================================================
# Hot reload habilitado
quarkus.live-reload.instrumentation=true
quarkus.live-reload.watched-resources=src/main/resources/META-INF/resources/**

# Dev UI (configuração removida - extensão não disponível)

# =============================================================================
# CONFIGURAÇÕES DE AGENDAMENTO - DESENVOLVIMENTO
# =============================================================================
# Tarefa agendada com intervalo menor para testes
scheduler.progresso.identity=atualiza-progresso-leitura-dev

# Agendamento para 8h UTC (5h da manh� em Bras�lia)
scheduler.progresso.cron=0 0 8 * * ?

# =============================================================================
# CONFIGURAÇÕES DE TIMEZONE
# =============================================================================
quarkus.jvm.args=-Duser.timezone=America/Sao_Paulo

# =============================================================================
# CONFIGURAÇÕES DE CORS - DESENVOLVIMENTO
# =============================================================================
# CORS liberado para desenvolvimento local
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8080,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-max-age=86400

# =============================================================================
# CONFIGURAÇÕES DE SWAGGER/OPENAPI - DESENVOLVIMENTO
# =============================================================================
# Swagger sempre disponível em desenvolvimento
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.path=/swagger-ui

# Configurações adicionais para desenvolvimento
quarkus.swagger-ui.theme=flattop
quarkus.swagger-ui.title=Leitura API - Desenvolvimento
quarkus.swagger-ui.footer=Ambiente de Desenvolvimento

# OpenAPI com mais detalhes em desenvolvimento
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de leituras - Ambiente de Desenvolvimento
quarkus.smallrye-openapi.servers=http://localhost:8080

# =============================================================================
# CONFIGURAÇÕES DE PERFORMANCE - DESENVOLVIMENTO
# =============================================================================
# Health checks habilitados
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready

# Métricas habilitadas para monitoramento em desenvolvimento
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# =============================================================================
# CONFIGURAÇÕES DE SEGURANÇA - DESENVOLVIMENTO
# =============================================================================
# Headers de segurança mais relaxados para desenvolvimento
# quarkus.http.header."X-Content-Type-Options".value=nosniff
# quarkus.http.header."X-Frame-Options".value=SAMEORIGIN
# quarkus.http.header."X-XSS-Protection".value=1; mode=block

# =============================================================================
# CONFIGURAÇÕES DE HTTP - DESENVOLVIMENTO
# =============================================================================
# Timeouts maiores para debugging
quarkus.http.read-timeout=60S
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=50M

# Compressão desabilitada para facilitar debugging
quarkus.http.enable-compression=false
